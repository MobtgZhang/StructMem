seed: 42
output_dir: ../results/dense-only
memory_file: ../inputs/train_experiences.json
online_memory_updates: false
top_k: 5
prefilter_k: 50
memory_token_budget: 2000
api:
  config_file: api.example.json
  model: gpt-5.6-sol
  cache_file: ../results/dense-only/llm_cache.sqlite3
methods: [embedding_retrieval]
datasets:
  scienceworld:
    split: test
    tasks: 100
    max_steps: 50
    options: {engine_max_steps: 100, startup_timeout_seconds: 30}
  agentbench:
    split: standard
    tasks: 100
    max_steps: 30
    options: {suite: dbbench-std, protocol: local_dbbench, max_round: 15}
  alfworld:
    enabled: false
    split: train
    tasks: 100
    max_steps: 50
    options: {offset: 3253}
