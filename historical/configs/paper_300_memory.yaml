seed: 42
output_dir: ../results/paper_300_per_method/gpt-5.6-sol/memory_collection
resume: true
online_memory_updates: false
top_k: 0
prefilter_k: 0
memory_token_budget: 0

api:
  config_file: ../api.json
  model: gpt-5.6-sol
  timeout_seconds: 120
  max_retries: 8
  retry_base_seconds: 5
  retry_max_seconds: 60

methods:
  - no_memory

datasets:
  alfworld:
    enabled: true
    split: train
    tasks: 100
    max_steps: 50
    options:
      data_root: ${ALFWORLD_DATA}
      offset: 0
  scienceworld:
    enabled: true
    split: train
    tasks: 100
    max_steps: 50
    options:
      engine_max_steps: 100
      startup_timeout_seconds: 30
  agentbench:
    enabled: true
    split: train
    tasks: 100
    max_steps: 30
    options:
      suite: dbbench-env_train
      protocol: local_dbbench
      max_round: 15
